<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вступ до JS</title>
</head>
<body>
    <h1>Вступ до JavaScript</h1>
    <p  onclick="alert('Пасхалочка')">
        JavaScript від 2005 року є стандартом, що входить до HTML.
        Коли мова іде про JavaScript можливі два розуміння:
        браузерний JS, що працює на веб-сторінках, та окрема мова
        програмування, що запускається іншою програмою Node.JS
    </p>
    <button onclick="alert('Привіт')">Вітання</button>
</body>
</html>
